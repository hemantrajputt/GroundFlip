name: live-smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model alias or snapshot
        required: true
        default: gpt-5.6-terra

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    environment: live-evals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[openai]"
      - name: Run paired live demo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROUNDFLIP_OPENAI_MODEL: ${{ inputs.model }}
        run: groundflip demo --provider openai --runs 5 --out .groundflip/live
      - uses: actions/upload-artifact@v4
        with:
          name: redacted-live-evidence
          path: .groundflip/live
          retention-days: 14

