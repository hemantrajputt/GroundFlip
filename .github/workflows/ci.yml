name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: ruff check src tests
      - run: python -m build
      - if: matrix.python == '3.13'
        run: groundflip benchmark --tier full --out /tmp/offline-full.json

  mcp-interop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,interop]"
      - run: >-
          python -m pytest
          tests/test_mcp_proxy.py
          tests/test_proxy_limits.py
          tests/test_mcp_sdk_interop.py
          tests/test_mcp_v2_modern_interop.py
